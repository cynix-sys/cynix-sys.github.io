<style>
:root{--bg:#dbd9c7;--fg:#16161c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;pointer-events:none}

#sw{width:104px;position:relative;padding:0}
#sw .k{position:absolute;top:3px;left:3px;width:36px;height:36px;border-radius:50%;background:var(--fg);transition:transform .6s cubic-bezier(.7,0,.2,1),background .4s}
#sw.b .k{transform:translateX(60px)}
#sw i{position:absolute;top:0;left:0;width:42px;height:100%;display:grid;place-items:center;font-style:normal;letter-spacing:0;color:var(--fg);transition:color .4s}
#sw i:last-of-type{left:auto;right:0}
#sw:not(.b) i:first-of-type,#sw.b i:last-of-type{color:var(--bg)}

function makeDust(){const n=P?70:110,pos=new Float32Array(n*3),sp=[];
 for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*W*1.15;pos[i*3+1]=(Math.random()-.5)*H*1.1;pos[i*3+2]=(Math.random()-.5)*700;sp.push(.2+Math.random()*.6)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 dust=new THREE.Points(geo,new THREE.PointsMaterial({color:INK,size:3,sizeAttenuation:false,transparent:true,opacity:0,depthTest:false,depthWrite:false}));
 dust.renderOrder=6;dust.userData.sp=sp;world.add(dust)}

function build(){
 layers.forEach(L=>{world.remove(L.mesh);L.mesh.geometry.dispose()});layers.length=0;
 if(dust){world.remove(dust);dust.geometry.dispose()}
 setPal(mode);P=innerWidth/innerHeight<.9;W=P?1080:1920;H=P?1920:1080;resize();T0=performance.now();
 renderer.setClearColor(BEIGE);const rs=document.documentElement.style;rs.setProperty('--bg',BEIGE);rs.setProperty('--fg',INK);
 cm.uniforms.map.value=tex[mode];cm.uniforms.uTint.value.set(...(mode?[1,1,1]:[.98,.965,.882]));
 const bandY=P?1380:740,B=mode===1;
 const BW=14000,bx=B?[175,1750]:[100,1818],fa='200px Anton, Impact',fs='700 200px "Dancing Script", cursive';
 addLayer(flat(BEIGE),{w:BW,h:BW,z:-500,order:0,static:true});
 addLayer(flat(INK),{w:BW,h:3400,y:H/2-bandY-1700,z:-480,order:1,static:true});
 addLayer(canvasMat(P?detailsP:details),{order:2,z:-260,delay:.6,from:[0,-20]});
 if(B)addLayer(blobMat(),{order:2.5,z:-140,delay:.3,from:[0,30],dur:1.4});
 addLayer(canvasMat(g=>{g.fillStyle=INK;P?fit(g,NAME[mode],fa,B?30:46,40,1040,880,400,false,1.5):fit(g,NAME[mode],fa,B?30:46,bx[0],bx[1],555,310,false,1.5)}),{order:3,z:-200,delay:.15,from:[0,70]});
 const im=tex[mode].image,ch=P?(B?1500:1360):(B?1050:1010),cw=ch*im.width/im.height;
 const cx=P?0:(B?30:-17),cy=P?-H/2+ch/2:540-((B?60:95)+ch/2);
 const shm=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{map:{value:tex[mode]},uAlpha:{value:0},uStr:{value:.25}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D map;uniform float uAlpha,uStr;varying vec2 vUv;void main(){vec2 u=(vUv-.5)*1.06+.5;float a=0.;for(int i=0;i<12;i++){float t=float(i)*.5236;vec2 o=vec2(cos(t),sin(t));a+=texture2D(map,u+o*.014).a+texture2D(map,u+o*.032).a;}a/=24.;gl_FragColor=vec4(.04,.02,.07,a*uAlpha*uStr);}'});
 addLayer(shm,{w:cw*1.06,h:ch*1.06,x:cx,y:cy,order:3.8,z:-90,pk:true,sh:true,delay:.45,from:[0,-90]});
 addLayer(cm,{w:cw,h:ch,x:cx,y:cy,order:4,z:0,pk:true,delay:.35,from:[0,-90]});
 addLayer(canvasMat(g=>{g.strokeStyle=INK;g.lineWidth=1.4;g.lineJoin='round';P?fit(g,NAME[mode],fs,B?0:70,70,1010,800,B?250:200,true,2.2):(B?fit(g,NAME[mode],fs,0,215,1735,470,215,true,2.2):fit(g,NAME[mode],fs,70,150,1775,472,170,true,1.5))}),{order:5,z:170,pk:true,delay:.9,from:[60,0]});
 addLayer(gm,{w:BW,h:BW,z:300,order:10,static:true});
 makeDust();document.getElementById('sw').classList.toggle('b',mode===1);
}
const gm=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{uTime:{value:0},uAlpha:{value:1}},
 vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform float uTime;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){float n=h(floor(gl_FragCoord.xy/2.)+floor(uTime*20.));gl_FragColor=vec4(vec3(step(.5,n)),.05);}'});

/* switch transition */
function doSwitch(){if(busy||!window.ready)return;busy=true;const nx=1-mode,p=PAL(nx),u=ovM.uniforms,d=renderer.getPixelRatio();
 const r=document.getElementById('sw').getBoundingClientRect();
 u.uCol.value.set(p.fg);u.uRing.value.set(p.bg);u.uP.value=0;u.uA.value=1;
 u.uC.value.set((r.left+r.width/2)*d,(innerHeight-(r.top+r.height/2))*d);u.uRes.value.set(innerWidth*d,innerHeight*d);
 ovMesh.visible=true;ov.ph=1;ov.t=performance.now();ov.next=nx;
 document.getElementById('sw').classList.toggle('b',nx===1);navigator.vibrate&&navigator.vibrate(18)}
document.getElementById('sw').onclick=doSwitch;
addEventListener('keydown',e=>{if([' ','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();doSwitch()}});

async function init(){
 tex=await Promise.all(SRC.map(s=>new Promise(r=>new THREE.TextureLoader().load(s,r))));
 tex.forEach(t=>{t.minFilter=THREE.LinearMipmapLinearFilter;t.anisotropy=8});
 try{await Promise.race([Promise.all(['200px Anton','700 200px "Dancing Script"','700 20px Syncopate'].map(f=>document.fonts.load(f,'DANI MULYAWAN'))),new Promise(r=>setTimeout(r,3000))])}catch(e){}
 cm=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{map:{value:tex[0]},uAlpha:{value:0},uTint:{value:new THREE.Vector3(1,1,1)},uTilt:{value:new THREE.Vector2()}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D map;uniform float uAlpha;uniform vec3 uTint;uniform vec2 uTilt;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);float hl=pow(max(0.,1.-abs(vUv.x-.5-uTilt.x*.55)*2.6),3.)*.16;gl_FragColor=vec4(c.rgb*uTint*(1.+hl*1.3)+hl*.12*c.a,c.a*uAlpha);}'});
 ovM=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,
  uniforms:{uRes:{value:new THREE.Vector2()},uC:{value:new THREE.Vector2()},uP:{value:0},uA:{value:1},uCol:{value:new THREE.Color()},uRing:{value:new THREE.Color()}},
  vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec2 uRes,uC;uniform float uP,uA;uniform vec3 uCol,uRing;void main(){float R=length(uRes)*1.05;float r=uP*R;vec2 q=gl_FragCoord.xy-uC;float d=length(q)+sin(atan(q.y,q.x)*7.+uP*9.)*R*.012*sin(uP*3.1416);float fill=1.-smoothstep(r-2.,r,d);float ring=(1.-smoothstep(0.,R*.012,abs(d-r+R*.01)))*step(.001,uP);gl_FragColor=vec4(mix(uCol,uRing,ring),max(fill,ring*.9)*uA);}'});
 ovMesh=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),ovM);ovMesh.renderOrder=100;ovMesh.visible=false;scene.add(ovMesh);
 build();window.ready=true;
 const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
 (function loop(){requestAnimationFrame(loop);const now=performance.now(),t=(now-T0)/1000;
  const sm=gyroOn?.3:.07;mouse.x+=(mouse.tx-mouse.x)*sm;mouse.y+=(mouse.ty-mouse.y)*sm;punch*=.9;
  const ax=gyroOn?0:Math.sin(t*.5)*.25,ay=gyroOn?0:Math.cos(t*.4)*.2;
  gm.uniforms.uTime.value=t;
  layers.forEach(L=>{const p=clamp((t-L.delay)/L.dur,0,1),e=1-Math.pow(1-p,3);
   if(!L.static)L.setA(e);
   const k=L.mesh.userData.k;L.mesh.position.x=L.bx+L.from[0]*(1-e)*k;
   L.mesh.position.y=L.by-L.from[1]*(1-e)*k;
   if(L.sh){const u=L.mesh.material.uniforms;L.mesh.position.x+=(18-(mouse.x+ax)*55)*k;L.mesh.position.y+=(-26+(mouse.y+ay)*30)*k;u.uStr.value+=((gyroOn?.62:.25)-u.uStr.value)*.08}
   L.mesh.scale.setScalar(k*(L.pk?1+.03*(1-e)+.035*punch:1))});
  world.rotation.y=(mouse.x+ax)*.30;world.rotation.x=(mouse.y+ay)*.2;
  cm.uniforms.uTilt.value.set(mouse.x+ax,mouse.y+ay);
  if(dust){const a=dust.geometry.attributes.position,sp=dust.userData.sp;
   for(let i=0;i<sp.length;i++){let y=a.array[i*3+1]+sp[i];if(y>H*.56)y=-H*.56;a.array[i*3+1]=y}
   a.needsUpdate=true;dust.material.opacity=.55*clamp(t-1,0,1);
   }
  if(ov.ph===1){const p=clamp((now-ov.t)/850,0,1);ovM.uniforms.uP.value=ease(p);
   if(p>=1){mode=ov.next;build();ov.ph=2;ov.t=now;ovM.uniforms.uP.value=1}}
  else if(ov.ph===2){const q=clamp((now-ov.t)/550,0,1);ovM.uniforms.uA.value=1-q;
   if(q>=1){ovMesh.visible=false;ov.ph=0;busy=false}}
  renderer.render(scene,cam)})();
}
init();
</script></body></html>
